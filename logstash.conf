input {
  file {
    path => "/datasets/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # Простой grok для вашего формата
  grok {
    match => { 
      "message" => "%{DATA:log_file} %{TIMESTAMP_ISO8601:timestamp} %{NUMBER:pid} %{LOGLEVEL:log_level} %{DATA:module} \[%{DATA:request_info}\] %{GREEDYDATA:log_message}"
    }
  }
  
  # Парсим timestamp
  date {
    match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
  }
  
  # Извлекаем IP и HTTP информацию если есть
  if [log_message] =~ /"GET/ {
    grok {
      match => { 
        "log_message" => "%{IP:client_ip} \"%{WORD:http_method} %{DATA:url} HTTP/%{NUMBER:http_version}\" status: %{NUMBER:response_code} len: %{NUMBER:response_length} time: %{NUMBER:response_time}"
      }
    }
  }
  
  # Преобразуем типы
  mutate {
    convert => {
      "pid" => "integer"
      "response_code" => "integer"
      "response_length" => "integer"
      "response_time" => "float"
    }
    
    # Добавляем теги
    add_tag => [ "nova_logs" ]
    
    # Удаляем исходное сообщение
    remove_field => [ "message", "timestamp" ]
  }
}

output {
  # Вывод в консоль для отладки
  stdout {
    codec => rubydebug
  }
  
  # Отправляем в Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nova-logs-%{+YYYY.MM.dd}"
  }
}
